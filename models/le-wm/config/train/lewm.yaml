defaults:
  - _self_
  - data: ogb

output_model_name: lewm
subdir: ${hydra:job.id}
run_validation: False
run_baseline_ckpt: False
train_num_episodes: 9000
val_num_episodes: 1000

concat_RGBD: False
concat_dataset: /home/student/data/ogbench/front_pixels_RGB_DEPTH_train_100_val_10_episodes

num_workers: 0
train_split: 0.9
seed: 3072
img_size: 224
patch_size: 14
encoder_scale: tiny
dump_object: True

trainer:
  max_epochs: 3
  devices: auto
  accelerator: gpu
  precision: bf16
  gradient_clip_val: 1.0

train_epochs:
  check_val_every_n_epoch: 1            # reduce validation and ckpts
  save_ckpt_every_epochs: 1

  early_stop_active: False              # early stopping
  early_stop_patience: 10
  early_stop_min_improv: 0.0005

  integrated_gradients_active: False    # custom callbacks
  linear_probing_active: True
  rnd_action_latent_mse: True

loader:
  batch_size: 32
  num_workers: ${num_workers}
  persistent_workers: True
  prefetch_factor: 3
  pin_memory: True

optimizer:
  type: AdamW
  lr: 5e-5
  weight_decay: 1e-3

wandb:
  enabled: True
  config:
    entity: lewm_3DGeo
    project: final_results
    name: RGB_10k
    id: ${subdir}
    resume: never
    log_model: False

wm:
  type: lewm
  history_size: 3
  num_preds: 2
  embed_dim: 192

predictor:
  depth: 6
  heads: 16
  mlp_dim: 2048
  dim_head: 64
  dropout: 0.1
  emb_dropout: 0.0

loss:
  sigreg:
    weight: 0.09
    kwargs:
      knots: 17
      num_proj: 1024
